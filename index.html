<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة المشروعات والمهام</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans antialiased">

    <!-- Login Container -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-800">منظومة إدارة المشروعات والمهام</h1>
                <p class="text-sm text-slate-500 mt-2">وزارة الموارد المائية والري - Supabase Cloud</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">البريد الإلكتروني الوظيفي</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="name@mwri-demo.gov.eg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors">
                    تسجيل الدخول إلى المنظومة
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Container (Hidden by default) -->
    <div id="dashboard-view" class="hidden min-h-screen p-8">
        <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4">لوحة القيادة والمتابعة</h2>
                <p id="user-welcome" class="text-slate-600 mb-6"></p>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm">تسجيل الخروج</button>
        </div>
    </div>

    <!-- JS SCRIPT -->
    <script>
        // ======================= SUPABASE CONFIGURATION =======================
        const SUPABASE_URL = 'https://zyzhysaxebxlenizbxme.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5emh5c2F4ZWJ4bGVuaXpieG1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NDg1OTQsImV4cCI6MjExMDIyNDU5NH0.xdSmfIwqYuZTlAUpDgfoYUoGc97NqZvpVYPh_XArYrA';

        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) {
            console.error('Supabase init error:', e);
        }

        // Handle Login Submission
        document.getElementById('login-form').addEventListener('submit async', async (e) => {});
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!supabaseClient) {
                alert('فشل الاتصال بقاعدة البيانات');
                return;
            }

            // 1. تسجيل الدخول عبر Supabase Auth
            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError) {
                alert('خطأ في تسجيل الدخول: ' + authError.message);
                return;
            }

            const user = authData.user;

            // 2. التحقق من وجود المستخدم في جدول الموظفين أو إنشائه تلقائياً لتجنب توقف المنظومة
            let { data: employee, error: empError } = await supabaseClient
                .from('employees')
                .select('*')
                .eq('id', user.id)
                .single();

            if (!employee) {
                // إنشاء سجل افتراضي للموظف إذا لم يكن موجوداً لتسهيل الدخول
                const defaultRole = email.includes('tarek') ? 'manager' : 'engineer';
                const defaultName = email.includes('tarek') ? 'م. طارق العسال' : 'مستخدم النظام';
                
                const { data: newEmp, error: insertError } = await supabaseClient
                    .from('employees')
                    .insert([{ id: user.id, email: user.email, name: defaultName, role: defaultRole }])
                    .select()
                    .single();

                if (insertError) {
                    alert('الحساب مسجل ولكن تعذر إنشاء سجل الموظف تلقائياً: ' + insertError.message);
                    return;
                }
                employee = newEmp;
            }

            // الانتقال إلى لوحة القيادة بنجاح
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-welcome').innerText = `مرحباً بك، ${employee.name} (${employee.role}) - البريد: ${employee.email}`;
        });

        // Handle Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('login-form').reset();
        });
    </script>
</body>
</html>
